# このファイルは開発専用です。本番イメージは backend/Dockerfile を単体でビルドしてください
# （本ファイルは参照しません）: docker build -t task-management-backend ./backend
#
# 起動: docker compose up --build
# ソースの変更は Gradle の継続ビルド(--continuous)が検知して自動で再コンパイルし、
# それを Spring Boot DevTools が検知してアプリを高速に再起動します（コンテナは再起動しません）。
#
# DB接続情報などの環境変数には既定値があります。既定値はローカル専用で、そのまま起動できます。
# 変えたいときだけ同ディレクトリに .env を作ってください（コミットしません）。
# 変えられる変数は README の「設定を変える」にあります。
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: task-management-frontend
    ports:
      - "5173:5173" # ブラウザからは http://localhost:5173 でアクセス（backendの8080・cloudbeaverの8978と衝突しない別ポート）
    volumes:
      - ./frontend:/workspace
      # ホスト側でバインドマウントした ./frontend が /workspace/node_modules も上書きしてしまうと、
      # イメージビルド時に npm ci で作ったLinux向けnode_modulesが消えてしまう。
      # 名前付きボリュームを重ねてそこだけコンテナ管理にすることで、ホストとコンテナのOSが違っても
      # （例：ネイティブ依存を含むパッケージ）正しく動くnode_modulesを保つ（build-outputと同じ発想）。
      - frontend-node-modules:/workspace/node_modules
    networks:
      - app-net
    # depends_on は付けない。frontendはビルド時にbackendへ接続しないため
    # （API呼び出しはコンテナ起動後、ブラウザがdev serverからHTMLを受け取ってから発生する）、
    # 起動順序を縛る必要がない。

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: task-management-backend
    ports:
      - "8080:8080"
      - "35729:35729" # Spring Boot DevTools の LiveReload（対応ブラウザ拡張と併用する場合に使用）
    environment:
      # dev プロファイルを有効化し application-dev.properties を読み込ませる
      # （例: Actuatorのhealth詳細表示を開発用に always へ上書き）。本番相当の既定値は
      # application.properties 側の安全側の値のままにしたいため、開発時のみ明示的に指定する。
      SPRING_PROFILES_ACTIVE: dev
      # application.properties が ${DB_URL} などのプレースホルダで参照する環境変数。
      # ホスト名 db は下の db サービス名。Compose が同一ネットワーク上で名前解決する。
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-taskmanagement}
      DB_USERNAME: ${POSTGRES_USER:-taskuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    depends_on:
      db:
        # db の healthcheck が healthy になるまで backend を起動しない（起動順の制御）。
        # これが無いと、DBが受付準備を終える前に Spring Boot が接続を試みて失敗し得る。
        condition: service_healthy
    volumes:
      - ./backend:/workspace
      - gradle-home:/root/.gradle # 依存(jar)キャッシュを永続化し、再起動のたびのDLを防ぐ
      - gradle-project-cache:/workspace/.gradle # プロジェクトのビルドキャッシュを永続化
      - build-output:/workspace/build # ビルド成果物(root所有)をホスト側に書き出さない
    networks:
      - app-net

  db:
    image: postgres:18
    container_name: task-management-db
    environment:
      # postgres 公式イメージは初回起動時にこの3つを読み、DBとユーザーを自動作成する。
      # 既定値はローカル専用。backend の DB_URL / DB_USERNAME / DB_PASSWORD の既定値と同じ値にしてある
      # （ずれると接続できない）。2回目以降の起動では読まれないため、作成済みのDBは変わらない。
      POSTGRES_DB: ${POSTGRES_DB:-taskmanagement}
      POSTGRES_USER: ${POSTGRES_USER:-taskuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    # ports は公開しない（内部化）。db への接続は app-net 経由（backend/cloudbeaverから）に限定し、
    # ホストから実データを見たい場合は cloudbeaver(GUI, http://localhost:8978) 経由で行う。
    volumes:
      # postgres:18 でデータ格納先の既定が変わり、マウント先は /var/lib/postgresql
      # （実データは /var/lib/postgresql/18/docker 配下）。旧来の /var/lib/postgresql/data ではない。
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # pg_isready で「接続受付可能」になったかを判定。backend の depends_on から参照する。
      # $$ は Compose に展開させず、コンテナ内の環境変数（上の POSTGRES_*）をそのまま読ませる。
      # 既定値をここにも書くと二重管理になる。
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s # 初回のDB初期化中は失敗を猶予する
    networks:
      - app-net

  # DB内容をブラウザから閲覧・操作するための開発用Web GUI（DBeaver公式のWeb版=CloudBeaver）。
  # PostgreSQL以外(MySQL等)も同じUIで扱えるため、プロジェクトが変わってもGUI操作に迷わずに済む。
  cloudbeaver:
    image: dbeaver/cloudbeaver:26
    container_name: task-management-cloudbeaver
    networks:
      - app-net
    ports:
      - "8978:8978" # ブラウザからは http://localhost:8978 でアクセス（backendの8080と衝突しない別ポート）
    environment:
      # 初回起動時の自動設定。この4つがそろうと、管理者アカウントを事前設定してセットアップウィザードを省略する
      # （1つでも欠けると自動設定されず、ウィザードの画面になる）。
      # これはGUI自身へのログイン情報で、DB認証(POSTGRES_*)とは別レイヤ。
      # 既定値はローカル専用。cloudbeaver-workspace ボリュームが空の初回起動時だけ読まれ、
      # 設定済みのボリュームでは自動設定は走らず、2回目以降に変えても反映されない。
      CB_SERVER_NAME: ${CB_SERVER_NAME:-task-management-local}
      CB_SERVER_URL: ${CB_SERVER_URL:-http://localhost:8978}
      CB_ADMIN_NAME: ${CB_ADMIN_NAME:-cbadmin}
      CB_ADMIN_PASSWORD: ${CB_ADMIN_PASSWORD:-LocalDev1only}
    volumes:
      - cloudbeaver-workspace:/opt/cloudbeaver/workspace # 登録したDB接続やGUI設定を永続化
    depends_on:
      db:
        # db の healthcheck が healthy になるまで起動しない（backendと同じ流儀）。
        condition: service_healthy

volumes:
  frontend-node-modules: # コンテナ内でnpm ciしたnode_modulesをホストのバインドマウントから守る
  gradle-home:
  gradle-project-cache:
  build-output:
  postgres-data: # DBデータの永続化（コンテナを作り直してもデータが残る）
  cloudbeaver-workspace: # CloudBeaverの設定・登録済みDB接続の永続化

networks:
  app-net: # frontend/backend/db/cloudbeaver 間の内部通信用。db はこのネットワーク経由でのみ到達可能（ホスト非公開）
  # frontendは今のところ他サービスとapp-net経由の通信を行わない（devサーバーがブラウザに
  # 配信するだけ）が、将来的な構成変更（例：本番でのリバースプロキシ経由通信）に備えて参加させておく。
