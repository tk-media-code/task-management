# EC2上の /etc/nginx/nginx.conf をこのファイルで丸ごと置き換える。
# 配布は scripts/deploy.sh --web が行う。
#
# conf.d/ に自分の設定を足す方式にしていない理由は、Amazon Linux 2023 の
# 既定の nginx.conf が server_name _ の server ブロックを持っているためである。
# その状態で conf.d に default_server を足すと、どちらが選ばれるかが
# include の順序に左右され、負けると既定のウェルカムページが出続ける。
# 「設定したのに反映されない」という分かりにくい詰まり方をするので、
# 曖昧さの原因ごと置き換えてしまう。
#
# このファイルはTerraformの管理外に置いている。user_dataに含めると、
# 修正のたびにEC2インスタンスの作り直し（IPも変わる）が必要になるためである。
# scpで配れば nginx -t で検証してから reload するだけで済む。

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    types_hash_max_size 4096;

    # Viteのビルド成果物のJSは数百KBあるため、圧縮の効果が大きい。
    # 画像やフォントは既に圧縮済みなので対象から外す。
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;   # IPでもパブリックDNS名でも受け付ける

        root  /var/www/dist;
        index index.html;

        # ヘルスチェック。
        # "=" は完全一致を意味するので、/actuator/ 配下の他のパスは公開されない。
        # バックエンドは management.endpoints.web.exposure.include を指定しておらず
        # 既定の health のみが有効で、さらに show-details=never のため、
        # 応答は {"status":"UP"} だけになる。内部情報は漏れない。
        location = /actuator/health {
            proxy_pass http://127.0.0.1:8080;
        }

        # APIをバックエンドのコンテナへ中継する。
        location /api/ {
            # proxy_pass の末尾にスラッシュを付けてはいけない。
            #
            #   付けない → /api/boards がそのまま 127.0.0.1:8080/api/boards へ
            #   付ける   → /api/ が切り落とされ 127.0.0.1:8080/boards へ
            #
            # バックエンドは @RequestMapping("/api/boards") で待っているため、
            # 後者だと全APIが404になる。最も多い設定ミスなので注意する。
            proxy_pass http://127.0.0.1:8080;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Spring Bootの起動には20〜30秒かかる。その間は502になるが、
            # タイムアウトを短くしすぎると通常のリクエストまで切れてしまう。
            proxy_read_timeout 60s;
        }

        # Viteはファイル名にハッシュを埋め込む（例: index-a1b2c3d4.js）。
        # 内容が変われば必ずURLも変わるので、長期間キャッシュさせて問題ない。
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html はファイル名が固定なので、キャッシュさせてはいけない。
        # させると、新しい dist を配ったのにブラウザが古い画面を出し続け、
        # 「デプロイしたのに変わらない」という状態になる。
        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # SPAフォールバック。
        # React RouterのBrowserRouterを使っているため、/boards/1 や /search に
        # ブラウザから直接アクセスされたり、その画面でリロードされたりする。
        # サーバー上にそのようなファイルは存在しないので、404を返す代わりに
        # index.html を返し、どのパスを開くかの判断をJavaScript側に委ねる。
        # これを忘れると「画面遷移では動くのにリロードすると404」になる。
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
